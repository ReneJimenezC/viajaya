# Documentación de la interfaz (API) de ViajaYa en formato OpenAPI 3.1.
# Describe los endpoints YA implementados. Los del SAD 3.4 que faltan se agregan
# a este archivo al construir cada módulo.
openapi: 3.1.0

info:
  title: ViajaYa API
  version: 0.1.0
  summary: API REST del sistema de reservas turísticas ViajaYa (backend).
  description: |
    API REST sin estado (SAD 2.1, ADR-03), con dos módulos: `client` (turista) y `admin`.

    **Estado de esta versión (iteración de Construcción):**
    - Implementado: salud del servicio, autenticación del administrador (login, renovación
      y cierre de sesión), búsqueda de destinos (RF-01), cotización (RF-02) y CRUD de
      destinos (RF-07).
    - Implementado y probado como reglas de dominio (sin endpoint todavía):
      RN-02 (ventana de 48 h) y RN-04 (pasarela simulada). RN-01 (cupo) ya se usa en la
      búsqueda de destinos y en la cotización; RN-03 (tarifa), en la cotización.
    - Pendiente (SAD 3.4): `POST /reservas`, `POST /reservas/consulta`,
      `PATCH /reservas/{codigo}/fecha`, `POST /reservas/{codigo}/cancelar`,
      `GET /admin/reservas`, `PATCH /admin/pagos/{id}`.

    **Formato de errores (SAD 4):** todas las respuestas de error usan el esquema `Error`.
    Los mensajes van en español; `code` es fijo y en inglés para que el frontend lo compare.

    **Rutas `/admin/...`:** exigen la cabecera `Authorization: Bearer <accessToken>`
    (esquema `bearerAuth`). Sin token o con un token inválido o vencido → 401;
    con un rol distinto de `admin` → 403.

servers:
  - url: http://127.0.0.1:3000
    description: Desarrollo local (Docker o npm run dev)

tags:
  - name: Salud
    description: Estado del servicio (Docker y Render lo consultan).
  - name: Autenticación
    description: Sesión del administrador (SAD 2.3, ADR-06; refresh token N-7).
  - name: Destinos
    description: Búsqueda pública de destinos para el turista (RF-01).
  - name: Cotización
    description: Desglose del costo de un viaje antes de reservar (RF-02).
  - name: Admin - Destinos
    description: Gestión de destinos del administrador (RF-07). Exigen `bearerAuth`.

paths:
  /health:
    get:
      tags: [Salud]
      operationId: getHealth
      summary: Indica si la API está en funcionamiento.
      # Pública: no exige token
      security: []
      responses:
        '200':
          description: La API responde.

  /auth/login:
    post:
      tags: [Autenticación]
      operationId: login
      summary: Inicio de sesión del administrador.
      # Pública: es la ruta que entrega el token
      security: []
      description: |
        Verifica correo y contraseña (hash argon2id, RNF-02). Si son correctos, devuelve un
        access token JWT de 15 minutos y abre una sesión con un refresh token en la cookie
        `refresh_token` (HttpOnly, SameSite=Strict, Path=/auth).

        - Límite de intentos (SAD 6): 5 intentos **fallidos** cada 15 minutos por IP; los
          correctos no cuentan.
        - El mensaje de error es el mismo si el correo no existe o si la contraseña es
          incorrecta, y el tiempo de respuesta también (no revela qué correos existen).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@viajaya.test
              password: una frase larga y segura
      responses:
        '200':
          description: Credenciales correctas.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Correo o contraseña incorrectos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHORIZED
                  message: Correo o contraseña incorrectos
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Autenticación]
      operationId: refreshSession
      summary: Renueva el access token usando el refresh token de la cookie.
      description: |
        No lleva body: el refresh token viaja en la cookie `refresh_token`. Cada uso entrega
        un access token nuevo y un refresh token nuevo (rotación); el anterior deja de servir.

        - La sesión vence a los 20 minutos sin renovarse y, siempre, a las 8 horas del login.
        - Si se reutiliza un refresh token ya usado (después de 30 s de gracia), se anula
          toda la sesión.
        - Límite: 30 peticiones cada 15 minutos por IP (compartido con `/auth/logout`).
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Sesión renovada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetRefreshCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: |
            La sesión no existe, fue anulada, venció o el token fue reutilizado.
            La API también borra la cookie.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: UNAUTHORIZED
                  message: La sesión expiró o no es válida. Inicia sesión de nuevo.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Autenticación]
      operationId: logout
      summary: Cierra la sesión del administrador.
      description: |
        Anula la sesión del refresh token de la cookie y borra la cookie. Responde 204 aunque
        la sesión no exista (cerrar sesión dos veces no es un error).
      security:
        - refreshCookie: []
        - {}
      responses:
        '204':
          description: Sesión cerrada.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /destinos:
    get:
      tags: [Destinos]
      operationId: searchDestinations
      summary: Busca destinos activos y, con fecha y personas, su disponibilidad (CU-01).
      description: |
        Sin parámetros, lista los destinos activos ordenados por nombre. `fecha` y `personas`
        van juntas: con ellas, cada destino trae los cupos libres ese día y si alcanzan para
        el grupo (RN-01; cuentan las reservas Pendiente y Aprobada). Es informativo: al
        reservar se vuelve a validar el cupo con bloqueo (CU-03, SAD 3.2).
      security: []
      parameters:
        - name: lugar
          in: query
          description: Texto que debe contener el lugar, sin distinguir mayúsculas.
          schema:
            type: string
            maxLength: 150
          example: puntarenas
        - name: fecha
          in: query
          description: Fecha del viaje (AAAA-MM-DD), posterior a hoy en Costa Rica.
          schema:
            type: string
            format: date
          example: '2026-12-10'
        - name: personas
          in: query
          description: Cantidad de personas, de 1 a 9999.
          schema:
            type: integer
            minimum: 1
            maximum: 9999
          example: 4
      responses:
        '200':
          description: Destinos encontrados (puede ser una lista vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicDestination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

  /cotizaciones:
    post:
      tags: [Cotización]
      operationId: createQuote
      summary: Calcula el desglose del costo de un viaje (CU-02).
      description: |
        Revisa que la fecha sea posterior a hoy en Costa Rica, que el destino exista y esté
        activo, y que haya cupo para el grupo ese día (RN-01). Si todo cumple, devuelve el
        desglose de RN-03: precio base, subtotal, IVA (13 %) y total.

        - No guarda nada (por eso responde 200 y no 201). Al reservar (CU-03) el servidor
          vuelve a validar el cupo con bloqueo y vuelve a calcular el total: nunca se acepta
          un monto enviado por el cliente.
        - Los montos van como texto con 2 decimales (colones).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: Cotización calculada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: El destino no existe o fue desactivado (CU-02 1a).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_FOUND
                  message: El destino no está disponible
        '409':
          description: No hay cupo suficiente para esa fecha (RN-01). El mensaje indica los cupos disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CONFLICT
                  message: 'No hay cupo suficiente para esa fecha. Cupos disponibles: 2'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/destinos:
    get:
      tags: [Admin - Destinos]
      operationId: listDestinations
      summary: Lista todos los destinos, activos e inactivos (CU-08).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Destinos registrados.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin - Destinos]
      operationId: createDestination
      summary: Registra un destino; queda activo (CU-07).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDestinationRequest'
      responses:
        '201':
          description: Destino creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Ya existe un destino con ese nombre (CU-07 6a).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/destinos/{id}:
    patch:
      tags: [Admin - Destinos]
      operationId: updateDestination
      summary: Modifica solo los campos enviados (CU-09).
      description: |
        La capacidad diaria no puede quedar por debajo de las personas ya reservadas en un
        mismo día futuro (422). Bloquea la fila del destino mientras modifica.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DestinationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDestinationRequest'
      responses:
        '200':
          description: Destino actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DestinationNotFound'
        '409':
          description: Ya existe un destino con ese nombre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: La capacidad es menor que las personas ya reservadas en un día futuro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

  /admin/destinos/{id}/desactivar:
    post:
      tags: [Admin - Destinos]
      operationId: deactivateDestination
      summary: Desactiva un destino activo (CU-10). No se borra; sus reservas se conservan.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DestinationId'
      responses:
        '200':
          description: Destino desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DestinationNotFound'
        '409':
          description: El destino ya está inactivo (CU-10 2a).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    DestinationId:
      name: id
      in: path
      required: true
      description: Id del destino (entero positivo). Un id inválido responde 404.
      schema:
        type: integer
        minimum: 1

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token del administrador (HS256, 15 minutos). Contenido:
        `sub` (id del admin), `role` (`admin`), `iss` (`viajaya-api`),
        `aud` (`viajaya-admin`), `iat` y `exp`. Lo exigen las rutas `/admin/...`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Refresh token opaco (43 caracteres base64url). Solo lo envía el navegador a `/auth/...`.

  headers:
    SetRefreshCookie:
      description: 'Cookie con el refresh token nuevo: `refresh_token=<token>; Path=/auth; HttpOnly; SameSite=Strict` (y `Secure` en producción).'
      schema:
        type: string
    ClearRefreshCookie:
      description: Pide al navegador borrar la cookie `refresh_token`.
      schema:
        type: string
    NoStore:
      description: '`no-store`: las respuestas con tokens no se guardan en ninguna caché.'
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Segundos que faltan para poder intentar de nuevo.
      schema:
        type: integer
        minimum: 0

  schemas:
    Destination:
      type: object
      description: Destino completo, como lo ve el administrador.
      required: [id, name, description, place, basePrice, dailyCapacity, active]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, 'null']
        place:
          type: string
        basePrice:
          type: string
          description: Precio por persona en colones, con 2 decimales.
          example: '47500.00'
        dailyCapacity:
          type: integer
        active:
          type: boolean

    PublicDestination:
      type: object
      description: Destino como lo ve el turista. `availableSeats` y `available` solo vienen con fecha y personas.
      required: [id, name, description, place, basePrice]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, 'null']
        place:
          type: string
        basePrice:
          type: string
          example: '30000.00'
        availableSeats:
          type: integer
          description: Cupos libres ese día.
        available:
          type: boolean
          description: Si los cupos libres alcanzan para el grupo (RN-01).

    CreateDestinationRequest:
      type: object
      required: [name, place, basePrice, dailyCapacity]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Único sin distinguir mayúsculas ni espacios a los lados.
        place:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: [string, 'null']
          maxLength: 1000
        basePrice:
          type: number
          exclusiveMinimum: 0
          description: Colones, como máximo 2 decimales.
        dailyCapacity:
          type: integer
          minimum: 1
      example:
        name: Volcán Poás
        place: Poás, Alajuela
        description: Cráter y laguna
        basePrice: 25000
        dailyCapacity: 30

    UpdateDestinationRequest:
      type: object
      description: Los mismos campos que al crear, todos opcionales, pero al menos uno.
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        place:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: [string, 'null']
          maxLength: 1000
        basePrice:
          type: number
          exclusiveMinimum: 0
        dailyCapacity:
          type: integer
          minimum: 1
      example:
        basePrice: 27500

    QuoteRequest:
      type: object
      required: [destinationId, travelDate, people]
      additionalProperties: false
      properties:
        destinationId:
          type: integer
          minimum: 1
          maximum: 2147483647
        travelDate:
          type: string
          format: date
          description: Fecha del viaje (AAAA-MM-DD), posterior a hoy en Costa Rica.
        people:
          type: integer
          minimum: 1
          maximum: 9999
      example:
        destinationId: 4
        travelDate: '2026-12-10'
        people: 2

    Quote:
      type: object
      description: Desglose de la tarifa (RN-03). Total = (precio base × personas) × 1.13.
      required: [basePrice, people, subtotal, iva, total]
      properties:
        basePrice:
          type: string
          description: Precio por persona en colones, con 2 decimales.
        people:
          type: integer
        subtotal:
          type: string
          description: Precio base × personas.
        iva:
          type: string
          description: 13 % del subtotal, redondeado al céntimo (la mitad hacia arriba).
        total:
          type: string
          description: Subtotal + IVA.

    QuoteResult:
      type: object
      required: [destination, travelDate, quote]
      properties:
        destination:
          type: object
          required: [id, name, place]
          properties:
            id:
              type: integer
            name:
              type: string
            place:
              type: string
        travelDate:
          type: string
          format: date
        quote:
          $ref: '#/components/schemas/Quote'
      example:
        destination:
          id: 4
          name: Tortuguero
          place: Tortuguero, Limón
        travelDate: '2026-12-10'
        quote:
          basePrice: '47500.00'
          people: 2
          subtotal: '95000.00'
          iva: '12350.00'
          total: '107350.00'

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Se le quitan los espacios a los lados y se pasa a minúsculas.
        password:
          type: string
          minLength: 1
          maxLength: 128

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: 'JWT para la cabecera `Authorization: Bearer <accessToken>`.'
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Segundos de vida del access token.
          const: 900
      example:
        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYWRtaW4ifQ.firma
        tokenType: Bearer
        expiresIn: 900

    Error:
      type: object
      description: Formato único de errores (SAD 4).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PAYLOAD_TOO_LARGE
                - BUSINESS_RULE
                - TOO_MANY_REQUESTS
                - INTERNAL_ERROR
              description: |
                400 VALIDATION_ERROR · 401 UNAUTHORIZED · 403 FORBIDDEN · 404 NOT_FOUND ·
                409 CONFLICT (p. ej. sobrecupo, RN-01) · 413 PAYLOAD_TOO_LARGE ·
                422 BUSINESS_RULE (p. ej. ventana de 48 h, RN-02) · 429 TOO_MANY_REQUESTS ·
                500 INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              description: Solo en errores de validación; un elemento por campo.
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                  message:
                    type: string

  responses:
    Unauthorized:
      description: Falta el access token, o no es válido o venció.
      headers:
        WWW-Authenticate:
          description: '`Bearer` o `Bearer error="invalid_token"` (RFC 6750).'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Se requiere iniciar sesión como administrador.
    Forbidden:
      description: El token es válido, pero el rol no es `admin`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              message: No tienes permiso para realizar esta acción.
    DestinationNotFound:
      description: El destino no existe.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              message: El destino no existe
    ValidationError:
      description: Los datos enviados no cumplen el formato (o el JSON está mal escrito).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Los datos enviados no son válidos
              details:
                - field: email
                  message: El correo no tiene un formato válido
    PayloadTooLarge:
      description: El body supera los 10 KB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: La petición es demasiado grande
    TooManyRequests:
      description: Se superó el límite de intentos (SAD 6).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Demasiados intentos de inicio de sesión. Intenta de nuevo más tarde.
    InternalError:
      description: Error inesperado del servidor; el detalle queda solo en el log.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL_ERROR
              message: Ocurrió un error inesperado